[project]
name = "pymad8"
requires-python = ">=3.7"
dynamic = ["version"]
readme = "README.md"
description = "Write MAD8 models and load MAD8 output."
license = {file = "LICENCE.txt"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development"
    ]
authors = [
  {name = "BDSIM Collaboration", email = "stewart.boogert@rhul.ac.uk"}
]
maintainers = [
  {name = "Stewart Boogert", email = "stewart.boogert@rhul.ac.uk"}
]
dependencies = [
  "pandas",
  "matplotlib>=3.0",
  "numpy>=1.14",
  "fortranformat",
  "importlib-resources",
  "importlib-metadata",
  "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "sphinx", "sphinx-rtd-theme"]

[project.urls]
homepage = "https://bdsim-collaboration.github.io/web/"
documentation = "https://bdsim-collaboration.github.io/pymad8/"
repository = "https://github.com/bdsim-collaboration/pymad8"

[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/pymad8/_version.py"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers"
markers = ["sanity", "regression"]
testpaths = [
    "tests",
]